<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Start</title>
  <style>
    :root {
      --bg: #F5F5F7;
      --card-bg: #FFFFFF;
      --search-bg: rgba(0, 0, 0, 0.05);
      --search-border: rgba(0, 0, 0, 0.06);
      --search-focus: #0071E3;
      --text: #1D1D1F;
      --text-sec: #86868B;
      --squircle-border: rgba(0, 0, 0, 0.08);
      --squircle-shadow: 0 2px 8px rgba(0, 0, 0, 0.04), 0 0.5px 1.5px rgba(0, 0, 0, 0.03);
      --squircle-hover-shadow: 0 8px 20px rgba(0, 0, 0, 0.09), 0 1px 3px rgba(0, 0, 0, 0.04);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --card-bg: #1C1C1E;
        --search-bg: rgba(255, 255, 255, 0.09);
        --search-border: rgba(255, 255, 255, 0.09);
        --search-focus: #2997FF;
        --text: #F5F5F7;
        --text-sec: #86868B;
        --squircle-border: rgba(255, 255, 255, 0.12);
        --squircle-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        --squircle-hover-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
      }
    }

    :root[data-theme="dark"] {
      --bg: #000000;
      --card-bg: #1C1C1E;
      --search-bg: rgba(255, 255, 255, 0.09);
      --search-border: rgba(255, 255, 255, 0.09);
      --search-focus: #2997FF;
      --text: #F5F5F7;
      --text-sec: #86868B;
      --squircle-border: rgba(255, 255, 255, 0.12);
      --squircle-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      --squircle-hover-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      transition: background 0.2s cubic-bezier(0.16, 1, 0.3, 1), color 0.2s ease;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      padding: 0 4px;
    }

    .clock {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--text);
    }

    .theme-btn {
      background: var(--search-bg);
      border: 0.5px solid var(--search-border);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-sec);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .theme-btn:hover {
      color: var(--text);
      transform: scale(1.05);
    }

    /* Safari-style Search Pill */
    .search-wrap {
      margin-bottom: 28px;
    }

    .search-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      background: var(--search-bg);
      border: 0.5px solid var(--search-border);
      border-radius: 9999px;
      padding: 0 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.2s ease;
    }

    .search-pill:focus-within {
      border-color: var(--search-focus);
      background: var(--card-bg);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }

    .search-icon {
      width: 15px;
      height: 15px;
      color: var(--text-sec);
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 16px; /* Avoid iOS auto-zoom */
      -webkit-appearance: none;
    }

    .search-input::placeholder {
      color: var(--text-sec);
      font-size: 14.5px;
      font-weight: 400;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--text-sec);
      cursor: pointer;
      padding: 4px;
      display: none;
      font-size: 13px;
      line-height: 1;
    }

    .clear-btn.show {
      display: block;
    }

    /* Section Category */
    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-sec);
      letter-spacing: -0.01em;
      margin-bottom: 14px;
      padding-left: 6px;
    }

    /* Apple Squircle Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 16px 12px;
      justify-items: center;
    }

    /* Mobile: 4 equal columns */
    @media (max-width: 480px) {
      .top-bar {
        margin-bottom: 16px;
      }
      .clock {
        font-size: 28px;
      }
      .search-wrap {
        margin-bottom: 20px;
      }
      .grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 14px 6px;
      }
    }

    /* App Item */
    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      width: 72px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-item:active {
      transform: scale(0.92);
    }

    /* Apple Continuous Curvature Squircle */
    .squircle {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--card-bg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--squircle-shadow), inset 0 0 0 0.5px var(--squircle-border);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .app-item:hover .squircle {
        transform: translateY(-2.5px) scale(1.02);
        box-shadow: var(--squircle-hover-shadow), inset 0 0 0 0.5px var(--squircle-border);
      }
    }

    .icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

    .mono-fallback {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      display: none;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .app-name {
      margin-top: 6px;
      font-size: 11.5px;
      font-weight: 400;
      color: var(--text);
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .empty {
      text-align: center;
      padding: 50px 0;
      color: var(--text-sec);
      font-size: 13px;
      display: none;
    }

    .empty.show {
      display: block;
    }
  </style>
</head>

    // Live Clock
    function tick() {
      const d = new Date();
      document.getElementById('clock').textContent = 
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    setInterval(tick, 1000);
    tick();

    // Theme Toggle
    const themeBtn = document.getElementById('themeBtn');
    const moonIcon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
    const sunIcon = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
    
    function applyTheme(dark) {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.getElementById('themeIcon').innerHTML = dark ? sunIcon : moonIcon;
    }

    let isDark = localStorage.getItem('theme') === 'dark' || 
      (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    applyTheme(isDark);

    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      applyTheme(isDark);
    });

    // Render App Grid
    const content = document.getElementById('content');
    const empty = document.getElementById('empty');
    const search = document.getElementById('search');
    const clearBtn = document.getElementById('clearBtn');

    function render(query = '') {
      const q = query.trim().toLowerCase();
      clearBtn.classList.toggle('show', q.length > 0);

      const matched = ITEMS.filter(it => 
        !q || it.name.toLowerCase().includes(q) || it.domain.toLowerCase().includes(q)
      );

      if (matched.length === 0) {
        content.innerHTML = '';
        empty.classList.add('show');
        return;
      }
      empty.classList.remove('show');

      const groups = {};
      matched.forEach(it => {
        if (!groups[it.category]) groups[it.category] = [];
        groups[it.category].push(it);
      });

      let html = '';
      for (const [cat, list] of Object.entries(groups)) {
        html += `
          <div class="section">
            <div class="section-title">${cat}</div>
            <div class="grid">
              ${list.map(it => `
                <a href="${it.url}" target="_blank" rel="noopener noreferrer" class="app-item" title="${it.name}">
                  <div class="squircle">
                    <img 
                      class="icon-img" 
                      src="${it.icon}" 
                      alt="" 
                      loading="lazy" 
                      onerror="handleIconError(this, '${it.domain}')" 
                    />
                    <span class="mono-fallback">${it.monogram}</span>
                  </div>
                  <span class="app-name">${it.name}</span>
                </a>
              `).join('')}
            </div>
          </div>
        `;
      }
      content.innerHTML = html;
    }

    window.handleIconError = function(img, domain) {
      const fallbackUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
      if (img.src !== fallbackUrl) {
        img.src = fallbackUrl;
      } else {
        img.style.display = 'none';
        const fallbackText = img.nextElementSibling;
        if (fallbackText) fallbackText.style.display = 'block';
      }
    };

    render();

    search.addEventListener('input', (e) => render(e.target.value));

    clearBtn.addEventListener('click', () => {
      search.value = '';
      render();
      search.focus();
    });

    search.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = search.value.trim();
        if (!q) return;

        const qLower = q.toLowerCase();
        const matched = ITEMS.filter(it => 
          it.name.toLowerCase().includes(qLower) || it.domain.toLowerCase().includes(qLower)
        );

        if (matched.length === 1) {
          window.open(matched[0].url, '_blank');
        } else {
          window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
        }
      } else if (e.key === 'Escape') {
        search.value = '';
        render();
        search.blur();
      }
    });

    // Desktop Shortcut
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === '/' || (e.metaKey && e.key === 'k') || (e.ctrlKey && e.key === 'k')) {
        e.preventDefault();
        search.focus();
        search.select();
      }
    });
  </script>
